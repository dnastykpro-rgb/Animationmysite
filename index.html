<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherfall SMP — Промо-Студия</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;color:#f1f5f9;font-family:'Inter',sans-serif;display:flex;height:100vh;overflow:hidden}
.viewport{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#1e2433 0%,#0b0d12 100%);padding:16px}
.canvas-box{box-shadow:0 20px 50px rgba(0,0,0,.7);border:2px solid #2d3548;border-radius:12px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:100%;max-height:80vh;width:auto;height:auto}
.bar{margin-top:12px;display:flex;align-items:center;gap:10px;background:#181c26;padding:10px 16px;border-radius:10px;border:1px solid #2a3142;width:100%;max-width:650px}
.btn{background:#2a3142;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{background:#3b445b}
.btn-primary{background:#3b82f6}
.btn-record{background:#10b981;color:#052e16;font-weight:800;width:100%;padding:12px}
.btn-record.recording{background:#ef4444;color:#fff}
input[type="range"]{flex:1;accent-color:#3b82f6;cursor:pointer}
.time{font-size:13px;color:#94a3b8;min-width:85px;text-align:right}
.sidebar{width:350px;background:#151922;border-left:1px solid #262d3d;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:18px;font-weight:800;color:#38bdf8}
.group{background:#1c212e;padding:12px;border-radius:10px;border:1px solid #283042;display:flex;flex-direction:column;gap:8px}
.group label{font-size:11px;font-weight:700;color:#cbd5e1;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .btn.active{background:#3b82f6}
input[type="file"]{font-size:12px;color:#94a3b8}
textarea{width:100%;height:125px;background:#0f1219;color:#e2e8f0;border:1px solid #2d3548;border-radius:6px;padding:8px;font-family:monospace;font-size:11px;resize:vertical}
.hint{font-size:11px;color:#94a3b8;line-height:1.35}
</style>
<!-- Надежный CDN Cloudflare для РФ -->
<script src="three.min.js"></script>
</head>
<body>
<div class="viewport">
  <div class="canvas-box"><canvas id="outputCanvas" width="720" height="1280"></canvas></div>
  <div class="bar">
    <button id="playPauseBtn" class="btn btn-primary">Пауза</button>
    <button id="restartBtn" class="btn">Сначала</button>
    <input type="range" id="timelineSlider" min="0" max="22" step="0.05" value="0">
    <span id="timeDisplay" class="time">0.0 / 22.0с</span>
  </div>
</div>
<div class="sidebar">
  <div><h1>AETHERFALL SMP</h1><div class="hint">3D Промо-Студия • Версии 1.21.11 / 26.2</div></div>
  <div class="group"><label>1. Формат кадра</label><div class="grid2"><button id="btnVertical" class="btn active">9:16 Shorts</button><button id="btnHorizontal" class="btn">16:9 YouTube</button></div></div>
  <div class="group"><label>2. Скин (.PNG 64x64)</label><input type="file" id="skinInput" accept="image/png"></div>
  <div class="group"><label>3. Озвучка (.MP3 / .WAV)</label><input type="file" id="audInput" accept="audio/*"></div>
  <div class="group"><label>4. Субтитры (старт-конец | текст)</label>
    <textarea id="subsIn">0.5-3.2 | Привет! Ищешь идеальный сервер для выживания?
3.3-7.5 | Добро пожаловать на Aetherfall SMP!
7.6-11.2 | Уникальный мир, ламповое комьюнити и крутые ивенты!
11.3-16.0 | Заходи с версий 1.21.11 и 26.2 без лишних модов!
16.1-21.5 | IP уже ждёт тебя в описании. Увидимся в игре!</textarea>
    <button id="subBtn" class="btn">Обновить субтитры</button>
  </div>
  <div class="group"><label>5. Экспорт</label><button id="recBtn" class="btn btn-record">● Записать и скачать видео</button><div id="recordStatus" class="hint">Готов к работе.</div></div>
</div>

<!-- Проверка запуска сразу при открытии страницы -->
<script>
(function(){
  const c = document.getElementById('outputCanvas');
  const cx = c.getContext('2d');
  cx.fillStyle = '#0f172a'; cx.fillRect(0,0,720,1280);
  cx.fillStyle = '#38bdf8'; cx.font = 'bold 28px sans-serif'; cx.textAlign = 'center';
  cx.fillText('Загрузка 3D-сцены...', 360, 640);
  if (typeof THREE === 'undefined') {
    document.getElementById('recordStatus').innerHTML = '<b style="color:#ef4444">Ошибка: библиотека Three.js не загрузилась! Проверьте интернет или VPN.</b>';
  }
})();
</script>
<script src="scene.js?v=5"></script>
</body>
</html>
