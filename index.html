<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aetherfall SMP — Промо-Студия</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;color:#f1f5f9;font-family:'Inter',sans-serif;display:flex;height:100vh;overflow:hidden}
.viewport{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#1e2433 0%,#0b0d12 100%);padding:16px}
.canvas-box{box-shadow:0 20px 50px rgba(0,0,0,.7);border:2px solid #2d3548;border-radius:12px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:100%;max-height:80vh;width:auto;height:auto}
.bar{margin-top:12px;display:flex;align-items:center;gap:10px;background:#181c26;padding:10px 16px;border-radius:10px;border:1px solid #2a3142;width:100%;max-width:650px}
.btn{background:#2a3142;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{background:#3b445b}
.btn-primary{background:#3b82f6}
.btn-record{background:#10b981;color:#052e16;font-weight:800;width:100%;padding:12px}
.btn-record.recording{background:#ef4444;color:#fff}
input[type="range"]{flex:1;accent-color:#3b82f6;cursor:pointer}
.time{font-size:13px;color:#94a3b8;min-width:85px;text-align:right}
.sidebar{width:350px;background:#151922;border-left:1px solid #262d3d;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:18px;font-weight:800;color:#38bdf8}
.group{background:#1c212e;padding:12px;border-radius:10px;border:1px solid #283042;display:flex;flex-direction:column;gap:8px}
.group label{font-size:11px;font-weight:700;color:#cbd5e1;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .btn.active{background:#3b82f6}
input[type="file"]{font-size:12px;color:#94a3b8}
textarea{width:100%;height:125px;background:#0f1219;color:#e2e8f0;border:1px solid #2d3548;border-radius:6px;padding:8px;font-family:monospace;font-size:11px;resize:vertical}
.hint{font-size:11px;color:#94a3b8;line-height:1.35}
</style>
<script src="three.min.js"></script>
</head>
<body>
<div class="viewport">
  <div class="canvas-box"><canvas id="outputCanvas" width="720" height="1280"></canvas></div>
  <div class="bar">
    <button id="playPauseBtn" class="btn btn-primary">Пауза</button>
    <button id="restartBtn" class="btn">Сначала</button>
    <input type="range" id="timelineSlider" min="0" max="22" step="0.05" value="0">
    <span id="timeDisplay" class="time">0.0 / 22.0с</span>
  </div>
</div>
<div class="sidebar">
  <div><h1>AETHERFALL SMP</h1><div class="hint">3D Промо-Студия • Версии 1.21.11 / 26.2</div></div>
  <div class="group"><label>1. Формат кадра</label><div class="grid2"><button id="btnVertical" class="btn active">9:16 Shorts</button><button id="btnHorizontal" class="btn">16:9 YouTube</button></div></div>
  <div class="group"><label>2. Скин (.PNG 64x64)</label><input type="file" id="skinInput" accept="image/png"></div>
  <div class="group"><label>3. Озвучка (.MP3 / .WAV)</label><input type="file" id="audInput" accept="audio/*"></div>
  <div class="group"><label>4. Субтитры (старт-конец | текст)</label>
    <textarea id="subsIn">0.5-3.2 | Привет! Ищешь идеальный сервер для выживания?
3.3-7.5 | Добро пожаловать на Aetherfall SMP!
7.6-11.2 | Уникальный мир, ламповое комьюнити и крутые ивенты!
11.3-16.0 | Заходи с версий 1.21.11 и 26.2 без лишних модов!
16.1-21.5 | IP уже ждёт тебя в описании. Увидимся в игре!</textarea>
    <button id="subBtn" class="btn">Обновить субтитры</button>
  </div>
  <div class="group"><label>5. Экспорт</label><button id="recBtn" class="btn btn-record">● Записать и скачать видео</button><div id="recordStatus" class="hint">Готов к работе.</div></div>
</div>
<script>
const recordStatus = document.getElementById('recordStatus');
window.onerror = function(msg, url, line) {
  recordStatus.innerHTML = '<b style="color:#ef4444">Ошибка (стр.' + line + '): ' + msg + '</b>';
};

try {
  if (typeof THREE === 'undefined') throw new Error('Файл three.min.js не найден!');

  const DURATION = 22.0;
  let currentTime = 0, isPlaying = true, isRecording = false, aspectMode = '9:16';
  const outputCanvas = document.getElementById('outputCanvas');
  const ctx2d = outputCanvas.getContext('2d');

  const glCanvas = document.createElement('canvas');
  const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, preserveDrawingBuffer: true });
  renderer.shadowMap.enabled = true;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x7cc4ff);
  scene.fog = new THREE.FogExp2(0x9bd6ff, 0.016);
  const camera = new THREE.PerspectiveCamera(48, 720 / 1280, 0.1, 200);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x4a7c59, 0.85));
  const dirLight = new THREE.DirectionalLight(0xfff5d6, 1.3);
  dirLight.position.set(18, 32, 15);
  dirLight.castShadow = true;
  scene.add(dirLight);

  function mkTex(fn) {
    const c = document.createElement('canvas'); c.width = 16; c.height = 16;
    fn(c.getContext('2d'));
    const t = new THREE.CanvasTexture(c);
    t.magFilter = t.minFilter = THREE.NearestFilter;
    return t;
  }
  const tGT = mkTex(x => { x.fillStyle = '#5da832'; x.fillRect(0,0,16,16); for(let i=0;i<40;i++){x.fillStyle=i%2?'#6ec23e':'#4d8f28';x.fillRect(Math.random()*16|0,Math.random()*16|0,1,1);} });
  const tGS = mkTex(x => { x.fillStyle = '#79553a'; x.fillRect(0,0,16,16); x.fillStyle = '#5da832'; x.fillRect(0,0,16,4); for(let i=0;i<16;i+=2)x.fillRect(i,4,1,2); });
  const tD = mkTex(x => { x.fillStyle = '#79553a'; x.fillRect(0,0,16,16); for(let i=0;i<40;i++){x.fillStyle='#61432d';x.fillRect(Math.random()*16|0,Math.random()*16|0,1,1);} });
  const tS = mkTex(x => { x.fillStyle = '#7d7d7d'; x.fillRect(0,0,16,16); for(let i=0;i<50;i++){x.fillStyle='#666';x.fillRect(Math.random()*16|0,Math.random()*16|0,2,1);} });
  const tW = mkTex(x => { x.fillStyle = '#6b5132'; x.fillRect(0,0,16,16); x.fillStyle = '#523d24'; for(let i=1;i<16;i+=3)x.fillRect(i,0,1,16); });
  const tP = mkTex(x => { x.fillStyle = '#a8844c'; x.fillRect(0,0,16,16); x.fillStyle = '#876838'; Array.of(3,7,11,15).forEach(y=>x.fillRect(0,y,16,1)); });
  const tL = mkTex(x => { x.fillStyle = '#3c8527'; x.fillRect(0,0,16,16); for(let i=0;i<50;i++){x.fillStyle='#2b631b';x.fillRect(Math.random()*16|0,Math.random()*16|0,2,2);} });

  const mG = Array.of(tGS,tGS,tGT,tD,tGS,tGS).map(m => new THREE.MeshLambertMaterial({ map: m }));
  const mD = new THREE.MeshLambertMaterial({ map: tD }), mS = new THREE.MeshLambertMaterial({ map: tS });
  const mW = new THREE.MeshLambertMaterial({ map: tW }), mP = new THREE.MeshLambertMaterial({ map: tP });
  const mL = new THREE.MeshLambertMaterial({ map: tL }), mLan = new THREE.MeshBasicMaterial({ color: 0xffd54f });

  const world = new THREE.Group(); scene.add(world);
  const bGeo = new THREE.BoxGeometry(1, 1, 1);
  function blk(x, y, z, m) { const o = new THREE.Mesh(bGeo, m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; world.add(o); }

  for (let x = -3; x <= 3; x++) for (let z = -2; z <= 3; z++) { if (Math.abs(x)==3 && Math.abs(z)==3) continue; blk(x,-.5,z,mG); blk(x,-1.5,z,mD); if (Math.abs(x)<=2 && Math.abs(z)<=2) blk(x,-2.5,z,mS); }
  for (let y = .5; y <= 3.5; y++) blk(-2, y, -1, mW);
  for (let x = -3; x <= -1; x++) for (let z = -2; z <= 0; z++) for (let y = 3.5; y <= 4.5; y++) if (!(x==-2 && z==-1 && y==3.5)) blk(x, y, z, mL);
  blk(-2, 5.5, -1, mL);

  for (let z = 4; z <= 9; z++) {
    blk(-1,-.5,z,mP); blk(0,-.5,z,mP); blk(1,-.5,z,mP);
    if (z % 3 == 1) Array.of(-1.3, 1.3).forEach(px => {
      const p = new THREE.Mesh(new THREE.BoxGeometry(.25,1.2,.25), mW); p.position.set(px,.5,z); world.add(p);
      const l = new THREE.Mesh(new THREE.BoxGeometry(.35,.4,.35), mLan); l.position.set(px,1.2,z); world.add(l);
    });
  }
  for (let x = -4; x <= 4; x++) for (let z = 10; z <= 16; z++) { if (Math.abs(x)==4 && (z==10 || z==16)) continue; blk(x,-.5,z,mG); blk(x,-1.5,z,mD); if (Math.abs(x)<=2 && z>=11 && z<=15) blk(x,-2.5,z,mS); }
  for (let y = .5; y <= 4.5; y++) blk(3, y, 12, mW);
  for (let x = 2; x <= 4; x++) for (let z = 11; z <= 13; z++) for (let y = 4.5; y <= 5.5; y++) blk(x, y, z, mL);
  const crys = new THREE.Mesh(new THREE.OctahedronGeometry(.55), new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: .7 }));
  crys.position.set(-3, .6, 13); world.add(crys);
  const bgCoords = Array.of(Array.of(-14, 2, 6), Array.of(15, -1, 10), Array.of(-12, 5, 22));
  const bgIsl = bgCoords.map((c, i) => {
    const g = new THREE.Group();
    for (let x = -2; x <= 2; x++) for (let z = -2; z <= 2; z++) { const b = new THREE.Mesh(bGeo, mG); b.position.set(x,0,z); g.add(b); }
    g.position.set(c.at(0), c.at(1), c.at(2)); scene.add(g);
    return { g, y: c.at(1), p: i * 2 };
  });

  const clouds = [];
  for (let i = 0; i < 16; i++) {
    const c = new THREE.Mesh(new THREE.BoxGeometry(5,.8,3), new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: .85 }));
    c.position.set((Math.random()-.5)*55, 9+Math.random()*10, -10+Math.random()*55);
    scene.add(c); clouds.push(c);
  }

  function mkBan(t1, bg, bd, t2 = '') {
    const c = document.createElement('canvas'); c.width = 512; c.height = 160; const x = c.getContext('2d');
    x.fillStyle = bg; x.fillRect(8,8,496,144); x.strokeStyle = bd; x.lineWidth = 10; x.strokeRect(8,8,496,144);
    x.fillStyle = '#fff'; x.font = 'bold 40px "Press Start 2P", monospace'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(t1, 256, t2 ? 62 : 82);
    if (t2) { x.fillStyle = '#fde047'; x.font = 'bold 20px "Press Start 2P", monospace'; x.fillText(t2, 256, 118); }
    return new THREE.Mesh(new THREE.PlaneGeometry(3.2, 1), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, side: THREE.DoubleSide }));
  }
  const bTitle = mkBan('AETHERFALL', 'rgba(15,23,42,.9)', '#38bdf8', 'SMP SERVER'); scene.add(bTitle);
  const bV1 = mkBan('1.21.11', 'rgba(15,23,42,.9)', '#4ade80', 'JAVA EDITION'); bV1.position.set(1.85,2.35,13.5); bV1.rotation.y = -.25; bV1.scale.set(0,0,0); scene.add(bV1);
  const bV2 = mkBan('26.2', 'rgba(15,23,42,.9)', '#facc15', 'ПОДДЕРЖКА'); bV2.position.set(1.85,1.35,13.5); bV2.rotation.y = -.25; bV2.scale.set(0,0,0); scene.add(bV2);

  const defSkin = document.createElement('canvas'); defSkin.width = defSkin.height = 64; const sx = defSkin.getContext('2d');
  sx.fillStyle = '#f5cba7'; sx.fillRect(0,0,64,64); sx.fillStyle = '#3b2818'; sx.fillRect(0,0,32,8); sx.fillRect(0,8,8,8); sx.fillRect(16,8,16,8);
  sx.fillStyle = '#0284c7'; sx.fillRect(16,16,24,16); sx.fillStyle = '#0369a1'; sx.fillRect(40,16,16,12); sx.fillStyle = '#1e293b'; sx.fillRect(0,16,16,16);
  const skinTex = new THREE.CanvasTexture(defSkin); skinTex.magFilter = skinTex.minFilter = THREE.NearestFilter;

  function sBox(w, h, d, u, v) {
    const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv;
    const f = (i, x, y, fw, fh) => {
      const u0 = x/64, v0 = 1-(y+fh)/64, u1 = (x+fw)/64, v1 = 1-y/64;
      uv.setXY(i*4, u0, v1); uv.setXY(i*4+1, u1, v1); uv.setXY(i*4+2, u0, v0); uv.setXY(i*4+3, u1, v0);
    };
    f(0, u+d+w, v+d, d, h); f(1, u, v+d, d, h); f(2, u+d, v, w, d);
    f(3, u+d+w, v, w, d); f(4, u+d, v+d, w, h); f(5, u+d*2+w, v+d, w, h);
    const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ map: skinTex })); m.castShadow = true; return m;
  }

  const pRoot = new THREE.Group(); scene.add(pRoot);
  const body = sBox(.5,.75,.25,16,16); body.position.y = 1.125; pRoot.add(body);
  const headP = new THREE.Group(); headP.position.set(0,1.5,0); pRoot.add(headP);
  const head = sBox(.5,.5,.5,0,0); head.position.y = .25; headP.add(head);

  const face = new THREE.Group(); face.position.set(0,.25,.255); headP.add(face);
  const mkEye = x => {
    const g = new THREE.Group(); g.position.set(x,.02,0);
    g.add(new THREE.Mesh(new THREE.PlaneGeometry(.11,.065), new THREE.MeshBasicMaterial({ color: 0xffffff })));
    const p = new THREE.Mesh(new THREE.PlaneGeometry(.055,.065), new THREE.MeshBasicMaterial({ color: 0x0f172a })); p.position.z = .002; g.add(p);
    return g;
  };
  const lEye = mkEye(.11), rEye = mkEye(-.11); face.add(lEye, rEye);
  const mouth = new THREE.Mesh(new THREE.PlaneGeometry(.14,.06), new THREE.MeshBasicMaterial({ color: 0x450a0a })); mouth.position.set(0,-.11,.002); face.add(mouth);

  const mkLimb = (x, y, u, v, oy) => {
    const g = new THREE.Group(); g.position.set(x,y,0);
    const m = sBox(.25,.75,.25,u,v); m.position.y = oy; g.add(m); pRoot.add(g); return g;
  };
  const lArm = mkLimb(.375,1.45,40,16,-.325), rArm = mkLimb(-.375,1.45,40,16,-.325);
  const lLeg = mkLimb(.125,.75,0,16,-.375), rLeg = mkLimb(-.125,.75,0,16,-.375);

  let audEl = null, audCtx = null, analyser = null, audData = null, audDest = null;
  function setupAud(file) {
    if (audEl) audEl.pause();
    audEl = new Audio(URL.createObjectURL(file));
    if (!audCtx) audCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audCtx.createMediaElementSource(audEl);
    analyser = audCtx.createAnalyser(); analyser.fftSize = 256;
    audData = new Uint8Array(analyser.frequencyBinCount);
    audDest = audCtx.createMediaStreamDestination();
    src.connect(analyser); analyser.connect(audCtx.destination); analyser.connect(audDest);
    audEl.currentTime = currentTime;
    if (isPlaying) audEl.play();
  }
  let subs = [];
  function parseSubs() {
    subs = document.getElementById('subsIn').value.split('\n').map(l => {
      const p = l.split('|'); if (p.length < 2) return null;
      const tm = p.at(0).trim().split('-');
      return { s: parseFloat(tm.at(0)) || 0, e: parseFloat(tm.at(1)) || 0, t: p.slice(1).join('|').trim() };
    }).filter(Boolean);
  }
  parseSubs();

  const lerp = (a, b, t) => a + (b - a) * Math.max(0, Math.min(1, t));
  const sm = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  function update(t) {
    bgIsl.forEach(o => o.g.position.y = o.y + Math.sin(t * 1.2 + o.p) * .35);
    clouds.forEach(c => { c.position.x += .015; if (c.position.x > 30) c.position.x = -30; });
    crys.rotation.y = t * 1.5;
    lArm.rotation.set(0,0,.08); rArm.rotation.set(0,0,-.08); lLeg.rotation.set(0,0,0); rLeg.rotation.set(0,0,0); headP.rotation.set(0,0,0); pRoot.rotation.set(0,0,0);

    if (t < 3) {
      const p = sm(0, 2.2, t); pRoot.position.set(0,0,0);
      camera.position.set(lerp(-1.5,0,p), lerp(11,1.85,p), lerp(9,3.4,p)); camera.lookAt(0, lerp(2.5,1.35,p), 0);
      if (t > 1) { lArm.rotation.z = 2.6 + Math.sin(t*14)*.35; lArm.rotation.x = .2; headP.rotation.z = Math.sin(t*6)*.08; }
      const bs = sm(1.3, 1.9, t); bTitle.scale.set(bs,bs,bs); bTitle.position.set(0, 2.85 + Math.sin(t*3)*.08, .5);
    } else if (t < 11.2) {
      const z = lerp(0, 13, (t - 3) / 8.2), wc = t * 8.5;
      pRoot.position.set(0, Math.abs(Math.sin(wc)) * .08, z);
      lLeg.rotation.x = Math.sin(wc) * .65; rLeg.rotation.x = -Math.sin(wc) * .65; rArm.rotation.x = Math.sin(wc) * .5;
      lArm.rotation.x = -.7 + Math.sin(t*4.5)*.35; lArm.rotation.z = .35 + Math.cos(t*3.8)*.25;
      headP.rotation.y = Math.sin(t*2.2)*.12; headP.rotation.x = Math.sin(t*5)*.06;
      camera.position.set(Math.sin(t*.9)*.65, 1.75 + Math.sin(t*4.2)*.05, z + 3.3); camera.lookAt(0, 1.35, z);
      bTitle.scale.set(0,0,0);
    } else if (t < 16.2) {
      const lt = t - 11.2; pRoot.position.set(-.7, 0, 13.2); pRoot.rotation.y = .15;
      lArm.rotation.z = 1.1 + Math.sin(t*4)*.15; lArm.rotation.x = -.3;
      headP.rotation.y = (lt > .5 && lt < 2.5) ? .45 : .05;
      const v1 = sm(.4,.9,lt), v2 = sm(1.1,1.6,lt);
      bV1.scale.set(v1*.85,v1*.85,v1*.85); bV2.scale.set(v2*.85,v2*.85,v2*.85);
      camera.position.set(.35, 1.75, 17.2); camera.lookAt(.35, 1.4, 13.3);
    } else {
      const lt = t - 16.2; bV1.scale.set(0,0,0); bV2.scale.set(0,0,0);
      if (lt < 3.4) {
        pRoot.position.set(0, 0, 13.8); rArm.rotation.x = -.65; rArm.rotation.z = -.25 + Math.sin(t*10)*.12;
        camera.position.set(0, 1.7, 17); camera.lookAt(0, 1.3, 13.8);
      } else {
        const jt = lt - 3.4, jz = 13.8 + jt * 3.8, jy = Math.sin(Math.min(1, jt/1.4)*Math.PI)*2.2 - Math.pow(Math.max(0, jt-.5), 2)*3.5;
        pRoot.position.set(0, jy, jz); lArm.rotation.z = 2.2; rArm.rotation.z = -2.2;
        camera.position.set(0, 2.2, 18.2); camera.lookAt(0, Math.max(-2, jy+1), jz);
        const es = sm(.8, 1.5, jt); bTitle.position.set(0, 2.1, 14.5); bTitle.scale.set(es,es,es);
      }
    }
    const ey = (t % 3.6 > 3.45) ? .1 : 1; lEye.scale.y = rEye.scale.y = ey;
    let amp = .12;
    if (analyser && audEl && !audEl.paused) { analyser.getByteFrequencyData(audData); let s = 0; for (let i = 0; i < 30; i++) s += audData.at(i); amp = Math.min(1, (s/30)/140); }
    else if (subs.find(s => t >= s.s && t <= s.e)) amp = .15 + Math.abs(Math.sin(t*19)*Math.cos(t*11)) * .85;
    mouth.scale.y = .3 + amp * 1.8;
  }

  function drawFrame(t) {
    const W = outputCanvas.width, H = outputCanvas.height;
    if (glCanvas.width !== W || glCanvas.height !== H) { renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix(); }
    renderer.render(scene, camera);
    ctx2d.clearRect(0, 0, W, H); ctx2d.drawImage(glCanvas, 0, 0, W, H);

    if (t >= 16.5 && t <= 19.8) {
      ctx2d.save(); ctx2d.globalAlpha = Math.min(1, (t-16.5)*4) * Math.min(1, (19.8-t)*4);
      const bw = W * .78, bh = 60, bx = (W - bw) / 2, by = H * .68;
      ctx2d.fillStyle = 'rgba(15,23,42,.92)'; ctx2d.fillRect(bx, by, bw, bh); ctx2d.strokeStyle = '#38bdf8'; ctx2d.lineWidth = 4; ctx2d.strokeRect(bx, by, bw, bh);
      ctx2d.fillStyle = '#fde047'; ctx2d.font = `bold ${aspectMode=='9:16'?20:26}px "Press Start 2P", monospace`; ctx2d.textAlign = 'center'; ctx2d.textBaseline = 'middle';
      ctx2d.fillText('IP В ОПИСАНИИ', W / 2, by + bh / 2 + 2); ctx2d.restore();
    }

    const sub = subs.find(s => t >= s.s && t <= s.e);
    if (sub) {
      ctx2d.save(); const fs = aspectMode == '9:16' ? 20 : 26; ctx2d.font = `${fs}px "Press Start 2P", monospace`; ctx2d.textAlign = 'center'; ctx2d.textBaseline = 'middle';
      const mw = W * .86, words = sub.t.split(' '), lines = []; let cl = '';
      words.forEach(w => { const tl = cl ? cl + ' ' + w : w; if (ctx2d.measureText(tl).width > mw && cl) { lines.push(cl); cl = w; } else cl = tl; });
      if (cl) lines.push(cl);
      const lh = fs * 1.55, th = lines.length * lh + 24, sy = H * .82 - th / 2;
      ctx2d.fillStyle = 'rgba(0,0,0,.68)'; ctx2d.fillRect(W * .05, sy - 12, W * .9, th);
      lines.forEach((l, i) => {
        const ly = sy + 12 + i * lh + fs / 2;
        ctx2d.fillStyle = '#1e1e1e'; ctx2d.fillText(l, W/2 + 3, ly + 3);
        ctx2d.fillStyle = (l.includes('Aetherfall') || l.includes('1.21.11') || l.includes('26.2') || l.includes('IP')) ? '#38bdf8' : '#fff';
        ctx2d.fillText(l, W / 2, ly);
      });
      ctx2d.restore();
    }
  }

  const playBtn = document.getElementById('playPauseBtn'), slider = document.getElementById('timelineSlider'), timeTxt = document.getElementById('timeDisplay'), recBtn = document.getElementById('recBtn');
  playBtn.onclick = () => { isPlaying = !isPlaying; playBtn.textContent = isPlaying ? 'Пауза' : 'Играть'; if (audEl) { if (isPlaying) { if (audCtx && audCtx.state=='suspended') audCtx.resume(); audEl.currentTime = currentTime; audEl.play(); } else audEl.pause(); } };
  document.getElementById('restartBtn').onclick = () => { currentTime = 0; if (audEl) { audEl.currentTime = 0; if (isPlaying) audEl.play(); } };
  slider.oninput = e => { currentTime = parseFloat(e.target.value); if (audEl) audEl.currentTime = currentTime; };
  document.getElementById('btnVertical').onclick = e => { aspectMode = '9:16'; outputCanvas.width = 720; outputCanvas.height = 1280; e.target.classList.add('active'); document.getElementById('btnHorizontal').classList.remove('active'); };
  document.getElementById('btnHorizontal').onclick = e => { aspectMode = '16:9'; outputCanvas.width = 1280; outputCanvas.height = 720; e.target.classList.add('active'); document.getElementById('btnVertical').classList.remove('active'); };
  document.getElementById('skinInput').onchange = e => { const f = e.target.files.item(0); if (!f) return; const i = new Image(); i.onload = () => { skinTex.image = i; skinTex.needsUpdate = true; recordStatus.textContent = 'Скин применен!'; }; i.src = URL.createObjectURL(f); };
  document.getElementById('audInput').onchange = e => { const f = e.target.files.item(0); if (f) { setupAud(f); recordStatus.textContent = 'Озвучка загружена!'; } };
  document.getElementById('subBtn').onclick = () => { parseSubs(); recordStatus.textContent = 'Субтитры обновлены!'; };

  let rec = null, chunks = [];
  recBtn.onclick = () => {
    if (isRecording) return;
    try {
      isRecording = true; recBtn.classList.add('recording'); recBtn.textContent = 'Идет запись (0:22)...'; recordStatus.textContent = 'Не закрывайте вкладку, ролик записывается 22 сек...';
      currentTime = 0; isPlaying = true; playBtn.textContent = 'Пауза';
      const st = outputCanvas.captureStream(30);
      if (audDest) audDest.stream.getAudioTracks().forEach(tr => st.addTrack(tr));
      chunks = []; let mt = 'video/webm', ext = 'webm';
      if (MediaRecorder.isTypeSupported('video/mp4')) { mt = 'video/mp4'; ext = 'mp4'; }
      rec = new MediaRecorder(st, { mimeType: mt, videoBitsPerSecond: 5000000 });
      rec.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
      rec.onstop = () => {
        const url = URL.createObjectURL(new Blob(chunks, { type: mt })), a = document.createElement('a');
        a.style.display = 'none'; a.href = url; a.download = `Aetherfall_SMP_${aspectMode.replace(':','x')}.${ext}`;
        document.body.appendChild(a); a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
        isRecording = false; recBtn.classList.remove('recording'); recBtn.textContent = '● Записать и скачать видео'; recordStatus.textContent = 'Готово! Проверьте папку Загрузки.';
      };
      if (audEl) { if (audCtx && audCtx.state=='suspended') audCtx.resume(); audEl.currentTime = 0; audEl.play(); }
      rec.start(200);
    } catch (err) {
      isRecording = false; recBtn.classList.remove('recording'); recBtn.textContent = '● Записать и скачать видео'; recordStatus.textContent = 'Ошибка записи: ' + err.message;
    }
  };

  let last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (isPlaying) {
      currentTime += dt;
      if (currentTime >= DURATION) {
        if (isRecording && rec && rec.state == 'recording') { rec.stop(); currentTime = DURATION; isPlaying = false; playBtn.textContent = 'Играть'; }
        else { currentTime = 0; if (audEl) { audEl.currentTime = 0; audEl.play(); } }
      }
    }
    slider.value = currentTime;
    timeTxt.textContent = `${currentTime.toFixed(1)} / ${DURATION.toFixed(1)}с`;
    update(currentTime);
    drawFrame(currentTime);
  }
  requestAnimationFrame(loop);
} catch (e) {
  recordStatus.innerHTML = '<b style="color:#ef4444">Ошибка запуска: ' + e.message + '</b>';
}
</script>
</body>
</html>
